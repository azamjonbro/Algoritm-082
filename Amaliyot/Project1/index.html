<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="./style.css">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
 <title>Bro shop</title>
</head>
<body>
 <!-- header -->
 <header class="header">
  <div class="container header-container">
   <div class="logobox">
    <img height="60" style="border-radius: 10px" src="https://picsum.photos/id/290/100/80" alt="logo" loading="lazy" >
   </div>
   <ul class="header__list">
    <li><a href="#" class="list-item">item 1</a></li>
    <li><a href="#" class="list-item">item 2</a></li>
    <li><a href="#" class="list-item">item 3</a></li>
    <li><a href="#" class="list-item">item 4</a></li>
   </ul>
   <div class="shopicon">
    <i class="fa-solid fa-cart-shopping"></i>
    <div class="counter">0</div>
   </div>
  </div>
 </header>
 <!-- header finished -->
  <main>
   <section class="products">
    <div class="container">
     <div class="product-list">
      <div class="product">
       <div class="product-header">
        <img style="border-radius: 10px;" width="100%" src="https://picsum.photos/id/220/300/300" alt="Bilmiman nimanidir rasmi" loading="lazy" >
       </div>
       <div class="product-textbox">
        <h2 class="product-title">Lorem, ipsum dolor......</h2>
        <p class="product-desc">
         Lorem ipsum dolor sit amet consectetur adipisicing elit. Consequatur excepturi explicabo, fuga distinctio soluta nam quia voluptatem impedit est pariatur?
        </p>
        <b class="price">
         99.999 $
        </b>
       </div>
       <div class="buttonbox">
        <div class="left">
         <i class="fa-solid fa-link"></i>
         <i class="fa-solid fa-arrow-up-from-bracket"></i>
        </div>
        <div class="right">
         <button class="add-to-cart">
          Add to cart
         </button>
        </div>
       </div>
      </div>
     </div>
    </div>
   </section>
  </main>
 <script src="./index.js"></script>
</body>
</html>
